<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#7b8fbb">
  <title>Photobooth</title>
  <!-- ?v= forces browsers to load the new file after an update. Bump the number each time. -->
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <nav class="nav">
    <div class="timer" role="group" aria-label="Timer">
      <span>Timer</span>
      <button class="pill nav-pill" data-timer="3">3s</button>
      <button class="pill nav-pill" data-timer="5">5s</button>
      <button class="pill nav-pill" data-timer="10">10s</button>
    </div>
  </nav>

  <!-- Start screen -->
  <section id="pick" class="screen active">
    <header class="hero">
      <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="50.0,2.0 56.2,31.0 78.2,11.2 66.2,38.2 95.7,35.2 70.0,50.0 95.7,64.8 66.2,61.8 78.2,88.8 56.2,69.0 50.0,98.0 43.8,69.0 21.8,88.8 33.8,61.8 4.3,64.8 30.0,50.0 4.3,35.2 33.8,38.2 21.8,11.2 43.8,31.0"/>
      </svg>
      <h1>PHOTOBOOTH</h1>
    </header>

    <main class="cream">
      <h2>Templates</h2>
      <div id="grid" class="grid"></div>
      <label class="pill pink">
        + Add template
        <input id="upload" type="file" accept="image/png" multiple hidden>
      </label>

      <div id="gallery-section" class="gallery-section" hidden>
        <h2>Photos</h2>
        <div id="gallery" class="gallery"></div>
      </div>
    </main>
  </section>

  <!-- Taking photos -->
  <section id="booth" class="screen cream">
    <div class="booth-layout">
      <div class="booth-main">
        <div id="frame" class="frame">
          <video id="video" autoplay playsinline muted></video>
          <div id="count" class="count"></div>
          <div id="flash" class="flash"></div>
        </div>
        <p id="status" class="status"></p>
        <div class="row">
          <button id="backFromBooth" class="pill">Back</button>
          <button id="retakeAll" class="pill" hidden>Redo all</button>
          <button id="shoot" class="pill pink">Start</button>
          <button id="print" class="pill pink" hidden>Print</button>
        </div>
      </div>
      <aside id="strip" class="strip"></aside>
    </div>
  </section>

  <!-- Result -->
  <section id="result" class="screen cream">
    <div id="printer" class="printer">
      <div class="printer-body">
        <span class="printer-light"></span>
        <span class="printer-label">PHOTOBOOTH</span>
        <div class="printer-slot"></div>
      </div>
      <div class="paper-wrap">
        <img id="output" class="output" alt="Your photo">
      </div>
    </div>

    <button id="save" class="pill pink collect">Collect the photo!</button>
    <div class="row">
      <button id="backFromResult" class="pill">Back</button>
      <button id="retake" class="pill">Retake</button>
      <button id="deletePhoto" class="pill">Delete</button>
    </div>
  </section>

  <script src="app.js?v=4"></script>
</body>
</html>
